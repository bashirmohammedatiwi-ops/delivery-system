# شركة ديما الحياة - نظام إدارة التوصيل
# تشغيل: docker-compose up -d
# تطبيق الموظفين متاح على البورت 3002
# عند تعارض أسماء: docker rm -f delivery-driver-web delivery-employee-web delivery-system ثم docker-compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: delivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
      POSTGRES_USER: ${POSTGRES_USER:-delivery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delivery_secret_change_me}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delivery} -d ${POSTGRES_DB:-delivery}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: alhayat-delivery:latest
    container_name: delivery-system
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Build inside Docker network — do not use host DATABASE_URL (127.0.0.1 from migration scripts)
      - DATABASE_URL=postgres://${POSTGRES_USER:-delivery}:${POSTGRES_PASSWORD:-delivery_secret_change_me}@postgres:5432/${POSTGRES_DB:-delivery}
      - PG_POOL_MAX=${PG_POOL_MAX:-20}
    volumes:
      - app-data:/app/data
      - ./fonts:/app/fonts
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  employee-web:
    image: alhayat-delivery:latest
    container_name: delivery-employee-web
    restart: unless-stopped
    command: ["node", "server-employee.js"]
    environment:
      - NODE_ENV=production
      - EMPLOYEE_PORT=3002
      - MAIN_HOST=app
      - MAIN_PORT=3000
    depends_on:
      - app
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  driver-web:
    image: alhayat-delivery:latest
    container_name: delivery-driver-web
    restart: unless-stopped
    command: ["node", "server-driver.js"]
    environment:
      - NODE_ENV=production
      - DRIVER_PORT=3001
      - MAIN_HOST=app
      - MAIN_PORT=3000
    depends_on:
      - app
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Nginx - HTTPS (شغّله عند وجود دومين: docker-compose --profile https up -d)
  # أولاً شغّل: bash scripts/init-ssl.sh للحصول على شهادة Let's Encrypt
  # Certbot — الحصول على شهادة Let's Encrypt (مرة واحدة) — يستخدم البورت 80
  certbot-init:
    image: certbot/certbot
    volumes:
      - letsencrypt:/etc/letsencrypt:rw
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        certbot certonly --standalone -d $$DOMAIN --email "$$SSL_EMAIL" \
          --agree-tos --no-eff-email --non-interactive \
          && echo "تم الحصول على الشهادة بنجاح"
    environment:
      - DOMAIN=${DOMAIN}
      - SSL_EMAIL=${SSL_EMAIL:-noreply@example.com}
    profiles:
      - init-ssl

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: alhayat-delivery-nginx:latest
    container_name: delivery-nginx
    restart: unless-stopped
    profiles:
      - https
    volumes:
      - ./nginx/certbot-webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - app
      - employee-web
      - driver-web

volumes:
  app-data:
    driver: local
  pg-data:
    driver: local
  letsencrypt:
    driver: local
